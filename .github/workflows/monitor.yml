name: Jellycat Diner Availability Monitor

on:
  schedule:
    # Every 5 minutes -- GitHub's minimum allowed interval. Under load,
    # GitHub does not guarantee this fires exactly on time.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run availability check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 jellycat_monitor.py --once
